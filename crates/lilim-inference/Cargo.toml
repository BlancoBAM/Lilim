[package]
name = "lilim-inference"
version = "1.0.0"
edition = "2021"
description = "Lilim AI — Embedded mistral.rs inference engine (Phi-4-mini local model)"
license = "AGPL-3.0"

[lib]
name = "lilim_inference"
path = "src/lib.rs"

[features]
default = ["cpu"]
cpu = []
cuda = ["mistralrs/cuda"]
metal = ["mistralrs/metal"]
accelerate = ["mistralrs/accelerate"]

[dependencies]
# ── mistral.rs ML framework ──────────────────────────────────────
mistralrs = "0.8"

# ── HuggingFace Hub downloader ────────────────────────────────
hf-hub = { version = "0.3", features = ["tokio"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }

# ── Tokenizer ─────────────────────────────────────────────────
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# ── Async runtime ─────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"

# ── Serialization ─────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Error handling ────────────────────────────────────────────
anyhow = "1"
thiserror = "1"

# ── Logging ───────────────────────────────────────────────────
tracing = "0.1"

# ── Filesystem / paths ────────────────────────────────────────
dirs = "5"