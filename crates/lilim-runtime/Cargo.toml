[package]
name = "lilim-runtime"
version = "1.0.0"
edition = "2021"
description = "Lilim AI Assistant — Rust backend runtime for Lilith Linux"
license = "AGPL-3.0"

[[bin]]
name = "lilim-runtime"
path = "src/main.rs"

[dependencies]
# Lilim Core - pure Rust AI backend
lilim-core = { path = "../lilim-core" }

# Local inference engine (mistral.rs Phi-4-mini)
lilim-inference = { path = "../lilim-inference" }

# Web framework
axum = { version = "0.7", features = ["json", "ws", "multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Config parsing
config = { version = "0.14", features = ["yaml", "toml"] }
figment = { version = "0.10", features = ["yaml", "toml"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Config / paths
directories = "5.0"
once_cell = "1.19"

# Error handling
anyhow = "1.0"

# Date/time for audit logs
chrono = { version = "0.4", features = ["serde"] }

# Futures
futures-util = "0.3"

# Unix signal handling
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }