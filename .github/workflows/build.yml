name: Build & Package Lilim

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ── Python Tests ─────────────────────────────────────────────────────────────
  test-python:
    name: Python Brain Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic "litellm>=1.0" pyyaml httpx "beautifulsoup4>=4.12" "mcp>=1.19,<2"

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
        working-directory: ${{ github.workspace }}

  # ── Rust Build ──────────────────────────────────────────────────────────────
  build-rust:
    name: Build Rust Runtime
    runs-on: ubuntu-22.04
    needs: test-python
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build lilim-runtime (release)
        run: cargo build --release -p lilim-runtime
        # NOTE: Do NOT use -C target-cpu=native — the binary runs on end-user
        # hardware which may differ from the CI runner's CPU architecture.
        # Using native causes SIGILL on machines without the same CPU features.

      - name: Upload lilim-runtime binary
        uses: actions/upload-artifact@v4
        with:
          name: lilim-runtime
          path: target/release/lilim-runtime

  # ── Tauri Desktop Build ─────────────────────────────────────────────────────
  build-tauri:
    name: Build Tauri Desktop App
    runs-on: ubuntu-22.04
    needs: [test-python, build-rust]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libappindicator3-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'lilim_desktop/.nvmrc'
          cache: 'npm'
          cache-dependency-path: lilim_desktop/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: lilim_desktop

      - name: Build Tauri app
        run: npm run tauri build
        working-directory: lilim_desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify and Locate Tauri binary
        run: |
          RELEASE_DIR="lilim_desktop/src-tauri/target/release"
          # Search by known binary names first (most reliable)
          BIN_PATH=""
          for name in "tauri-lilim-desktop" "tauri-applilim-desktop" "Lilim" "lilim" "tauri-app"; do
            candidate="$RELEASE_DIR/$name"
            if [ -f "$candidate" ] && [ -x "$candidate" ]; then
              BIN_PATH="$candidate"
              break
            fi
          done
          # Generic fallback: find any ELF executable, excluding debug artifacts
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find "$RELEASE_DIR" -maxdepth 1 -type f -executable \
              ! -name "*.so" ! -name "*.d" ! -name ".cargo-lock" \
              | head -n 1)
          fi
          if [ -z "$BIN_PATH" ]; then
            echo "ERROR: Could not find Tauri binary"
            ls -la "$RELEASE_DIR/"
            exit 1
          fi
          echo "Found binary: $BIN_PATH"
          cp "$BIN_PATH" ./lilim-ui-executable
          chmod +x ./lilim-ui-executable

      - name: Upload Tauri binary
        uses: actions/upload-artifact@v4
        with:
          name: lilim-ui
          path: ./lilim-ui-executable

  # ── Build Packages ──────────────────────────────────────────────────────────
  build-release:
    name: Build .deb & Source Tarball
    runs-on: ubuntu-22.04
    needs: [ build-rust, build-tauri ]
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime
        uses: actions/download-artifact@v4
        with:
          name: lilim-runtime
          path: bin/runtime

      - name: Download UI
        uses: actions/download-artifact@v4
        with:
          name: lilim-ui
          path: bin/ui

      - name: Build Debian package
        run: |
          chmod +x packaging/build_deb.sh
          chmod +x bin/ui/lilim-ui-executable
          bash packaging/build_deb.sh \
            --runtime bin/runtime/lilim-runtime \
            --ui-binary bin/ui/lilim-ui-executable

      - name: Read product version
        id: product-version
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("lilim_desktop/src-tauri/tauri.conf.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build source tarball
        run: |
          mkdir -p dist
          # Clean source archive — no build artifacts, no git history
          git archive --format=tar.gz \
            --prefix=lilim-src/ \
            --output=dist/lilim-source.tar.gz \
            HEAD
          echo "Source tarball: $(du -sh dist/lilim-source.tar.gz | cut -f1)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: lilim-linux-amd64-packages
          path: dist/*

      - name: Create versioned release from marked main commit
        if: "github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: publish ')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.product-version.outputs.version }}"
          name: "Lilim v${{ steps.product-version.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          body: |
            ## Major model and feature upgrades

            - Phi-3.5-mini GGUF inference through Rust and Candle replaces Phi-2.
            - Autonomous tool use, MCP servers, BrowserOS, persistent memory, and prompt enhancement.
            - Linux desktop launcher, Tauri UI, command-line client, and one-command Debian installer.

            ## Why Phi-4 was deferred

            Phi-4 was considered, but Candle support was not stable enough for the production inference path. Lilim prioritizes quality, speed, memory safety, and a dependable Rust implementation for Lilith Linux.

            ## Planned features

            - [ ] OAuth authorization
            - [ ] Request proxies
            - [ ] Deeper Lilith Linux integration
            - [ ] Memory improvements
            - [ ] Prompt enhancement improvements
          files: |
            dist/*.deb
            dist/lilim-source.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
